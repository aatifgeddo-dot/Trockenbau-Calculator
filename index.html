
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RENASS CALCULATOR</title>

<style>
:root {
    --blue: #0759c7;
    --blue-light: #1689ed;
    --red: #ed2639;
    --white: #ffffff;
    --background: #f2f6fc;
    --dark: #142b49;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#eaf3ff,#ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 390px;
    background: var(--white);
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 15px 45px rgba(0,60,140,.15);
    border: 1px solid #e3edfa;
}

/* LOGO */

.logo {
    text-align: center;
    margin-bottom: 18px;
}

.logo img {
    width: 100px;
    height: 100px;
    object-fit: contain;
    border-radius: 50%;
}

.logo h1 {
    color: var(--blue);
    font-size: 23px;
    font-weight: 800;
    margin-top: 8px;
    letter-spacing: 1px;
}

.logo p {
    color: #8292a8;
    font-size: 12px;
    margin-top: 5px;
}

/* DISPLAY */

.display {
    background: linear-gradient(135deg,#1689ed,#0759c7);
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: right;
    color: white;
    overflow: hidden;
}

.previous {
    font-size: 15px;
    opacity: .8;
    min-height: 20px;
    overflow: hidden;
}

.current {
    font-size: 38px;
    font-weight: bold;
    overflow-x: auto;
    white-space: nowrap;
}

/* BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
}

button {
    height: 65px;
    border: none;
    border-radius: 17px;
    background: #eaf2fd;
    color: var(--blue);
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 3px 7px rgba(0,50,120,.06);
    -webkit-tap-highlight-color: transparent;
}

button:hover {
    background: #d5e8ff;
    transform: translateY(-2px);
}

button:active {
    transform: scale(.94);
}

.operator {
    background: var(--blue);
    color: white;
}

.operator:hover {
    background: #0646a0;
}

.action {
    background: #ffe9ec;
    color: var(--red);
}

.action:hover {
    background: #ffd5da;
}

.equal {
    background: var(--red);
    color: white;
}

.equal:hover {
    background: #c9182b;
}

.zero {
    grid-column: span 2;
}

.footer {
    text-align: center;
    margin-top: 22px;
    color: #8292a8;
    font-size: 12px;
}

.footer span {
    color: var(--red);
}

/* MOBILE */

@media(max-width:400px) {
    .container {
        padding: 18px;
    }

    button {
        height: 59px;
        font-size: 21px;
    }

    .current {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
       <img src="10000049900.png" alt="Calculator Logo">


        <h1>RENASS CALCULATOR</h1>
        <p>SMART • SIMPLE • PROFESSIONAL</p>
    </div>

    <!-- DISPLAY -->
    <div class="display">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
    </div>

    <!-- CALCULATOR BUTTONS -->
    <div class="buttons">

        <button class="action" onclick="clearAll()">AC</button>
        <button class="action" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="toggleSign()">+/-</button>
        <button class="zero" onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
        <p>© 2026 <span>RENASS</span> CALCULATOR</p>
        <p>Designed for everyday calculations</p>
    </div>

</div>

<script>

// DISPLAY ELEMENTS
const currentDisplay =
    document.getElementById("current");

const previousDisplay =
    document.getElementById("previous");

// CALCULATOR VARIABLES
let currentValue = "0";
let firstValue = null;
let operator = null;
let shouldReset = false;

// UPDATE DISPLAY
function updateDisplay() {
    currentDisplay.textContent = currentValue;
}

// ADD NUMBERS
function appendNumber(number) {

    if (currentValue === "Error") clearAll();

    if (shouldReset) {
        currentValue = "0";
        shouldReset = false;
    }

    if (number === "." &&
        currentValue.includes(".")) return;

    if (currentValue === "0" && number !== ".") {
        currentValue = number;
    } else {
        currentValue += number;
    }

    updateDisplay();
}

// SELECT OPERATOR
function chooseOperator(op) {

    if (currentValue === "Error") return;

    if (operator !== null && !shouldReset) {
        calculate();
    }

    firstValue = parseFloat(currentValue);
    operator = op;

    previousDisplay.textContent =
        firstValue + " " + op;

    shouldReset = true;
}

// CALCULATE
function calculate() {

    if (operator === null || firstValue === null)
        return;

    const secondValue = parseFloat(currentValue);
    let result;

    switch (operator) {

        case "+":
            result = firstValue + secondValue;
            break;

        case "-":
            result = firstValue - secondValue;
            break;

        case "*":
            result = firstValue * secondValue;
            break;

        case "/":
            result = secondValue === 0
                ? NaN
                : firstValue / secondValue;
            break;

        default:
            return;
    }

    previousDisplay.textContent =
        firstValue + " " + operator +
        " " + secondValue + " =";

    currentValue = Number.isFinite(result)
        ? String(Number(result.toPrecision(12)))
        : "Error";

    firstValue = null;
    operator = null;
    shouldReset = true;

    updateDisplay();
}

// PERCENTAGE
function percentage() {

    if (currentValue === "Error") return;

    currentValue = String(
        parseFloat(currentValue) / 100
    );

    updateDisplay();
}

// CHANGE SIGN
function toggleSign() {

    if (currentValue === "0" ||
        currentValue === "Error") return;

    currentValue = String(
        parseFloat(currentValue) * -1
    );

    updateDisplay();
}

// DELETE LAST NUMBER
function deleteLast() {

    if (currentValue === "Error") {
        clearAll();
        return;
    }

    if (shouldReset) return;

    currentValue = currentValue.length > 1
        ? currentValue.slice(0,-1)
        : "0";

    if (currentValue === "-") currentValue = "0";

    updateDisplay();
}

// CLEAR ALL
function clearAll() {

    currentValue = "0";
    firstValue = null;
    operator = null;
    shouldReset = false;

    previousDisplay.textContent = "";

    updateDisplay();
}

// KEYBOARD SUPPORT
document.addEventListener("keydown", function(event) {

    const key = event.key;

    if (/^[0-9.]$/.test(key)) {
        appendNumber(key);
    }

    else if (key === "+") {
        chooseOperator("+");
    }

    else if (key === "-") {
        chooseOperator("-");
    }

    else if (key === "*") {
        chooseOperator("*");
    }

    else if (key === "/") {
        event.preventDefault();
        chooseOperator("/");
    }

    else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
    }

    else if (key === "Backspace") {
        deleteLast();
    }

    else if (key === "Escape") {
        clearAll();
    }

    else if (key === "%") {
        percentage();
    }

});

</script>

</body>
</html>
